<svg xmlns="http://www.w3.org/2000/svg" width="760" height="383" viewBox="0 0 760 383" role="img" aria-labelledby="title"><title id="title">手机上先记下，电脑上接着做</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#b7b3ac" stroke-width="1.5"/></marker></defs><rect width="760" height="383" fill="#faf9f7"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif"><text x="32" y="48" font-size="26" fill="#1c1c1e" font-weight="600">手机上先记下，电脑上接着做</text><rect x="56" y="80" width="220" height="263" rx="16" fill="#fff" stroke="#e3e1dd"/><rect x="344" y="110" width="360" height="215" rx="16" fill="#fff" stroke="#e3e1dd"/><text x="80" y="120" font-size="22" fill="#8e8e93" font-weight="400">手机</text><text x="80" y="172" font-size="24" fill="#1c1c1e" font-weight="500">老师布置作业</text><text x="80" y="214" font-size="22" fill="#1c1c1e" font-weight="400">先记下要求</text><text x="80" y="259" font-size="22" fill="#1c1c1e" font-weight="400">留住参考资料</text><text x="368" y="150" font-size="22" fill="#8e8e93" font-weight="400">电脑</text><text x="368" y="195" font-size="24" fill="#1c1c1e" font-weight="500">打开同一份任务和笔记</text><text x="368" y="238" font-size="22" fill="#1c1c1e" font-weight="400">拆步骤 · 安排时间</text><text x="368" y="280" font-size="22" fill="#1463d9" font-weight="400">接着推进</text><path d="M280 214 L340 214" fill="none" stroke="#b7b3ac" stroke-width="2" marker-end="url(#arrow)"/></g></svg>