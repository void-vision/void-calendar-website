<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">日历里的任务，和任务的同名笔记</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#b7b3ac" stroke-width="1.5"/></marker></defs><rect width="760" height="380" fill="#faf9f7"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif"><text x="32" y="48" font-size="27" fill="#1c1c1e" font-weight="600">日历里的任务，和任务的同名笔记</text><rect x="32" y="80" width="328" height="220" rx="16" fill="#fff" stroke="#e3e1dd"/><rect x="400" y="80" width="328" height="220" rx="16" fill="#fff" stroke="#e3e1dd"/><text x="56" y="119" font-size="20" fill="#8e8e93" font-weight="400">日历里的任务</text><text x="56" y="166" font-size="28" fill="#1c1c1e" font-weight="600">完成历史课作业</text><text x="56" y="207" font-size="26" fill="#1463d9" font-weight="400">14:00–15:00</text><text x="56" y="257" font-size="21" fill="#6b6b70" font-weight="400">打开任务 →</text><text x="424" y="119" font-size="20" fill="#8e8e93" font-weight="400">同名笔记</text><rect x="424" y="146" width="19" height="19" rx="4" fill="none" stroke="#b7b3ac"/><text x="456" y="164" font-size="22" fill="#1c1c1e" font-weight="400">先看老师的要求</text><rect x="424" y="189" width="19" height="19" rx="4" fill="none" stroke="#b7b3ac"/><text x="456" y="207" font-size="22" fill="#1c1c1e" font-weight="400">找三份参考资料</text><rect x="424" y="232" width="19" height="19" rx="4" fill="none" stroke="#b7b3ac"/><text x="456" y="250" font-size="22" fill="#1c1c1e" font-weight="400">列出第一版提纲</text><path d="M362 192 L398 192" fill="none" stroke="#b7b3ac" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="344" font-size="23" fill="#6b6b70" font-weight="400">到了要做的时候，不用再找一遍资料。</text></g></svg>