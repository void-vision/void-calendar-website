<svg xmlns="http://www.w3.org/2000/svg" width="760" height="522" viewBox="0 0 760 522" role="img" aria-labelledby="title"><title id="title">做完前置任务，再开启下一步</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#b7b3ac" stroke-width="1.5"/></marker></defs><rect width="760" height="522" fill="#faf9f7"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif"><text x="32" y="48" font-size="26" fill="#1c1c1e" font-weight="600">做完前置任务，再开启下一步</text><rect x="80" y="78" width="600" height="74" rx="16" fill="#edf6ee" stroke="#e3e1dd"/><text x="105" y="125" font-size="24" fill="#8e8e93" font-weight="400">01</text><text x="170" y="125" font-size="29" fill="#1c1c1e" font-weight="500">查资料</text><text x="515" y="124" font-size="23" fill="#3b8b52" font-weight="400">已完成</text><path d="M380 155 L380 173" fill="none" stroke="#b7b3ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="176" width="600" height="74" rx="16" fill="#eef3fd" stroke="#e3e1dd"/><text x="105" y="223" font-size="24" fill="#8e8e93" font-weight="400">02</text><text x="170" y="223" font-size="29" fill="#1c1c1e" font-weight="500">列提纲</text><text x="515" y="222" font-size="23" fill="#1463d9" font-weight="400">可开始</text><path d="M380 253 L380 271" fill="none" stroke="#b7b3ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="274" width="600" height="74" rx="16" fill="#fff" stroke="#e3e1dd"/><text x="105" y="321" font-size="24" fill="#8e8e93" font-weight="400">03</text><text x="170" y="321" font-size="29" fill="#1c1c1e" font-weight="500">写正文</text><text x="515" y="320" font-size="23" fill="#8e8e93" font-weight="400">等待前置</text><path d="M380 351 L380 369" fill="none" stroke="#b7b3ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="372" width="600" height="74" rx="16" fill="#fff" stroke="#e3e1dd"/><text x="105" y="419" font-size="24" fill="#8e8e93" font-weight="400">04</text><text x="170" y="419" font-size="29" fill="#1c1c1e" font-weight="500">检查引用</text><text x="515" y="418" font-size="23" fill="#8e8e93" font-weight="400">等待前置</text><text x="80" y="486" font-size="22" fill="#6b6b70" font-weight="400">双链留住上下文，依赖关系决定先后顺序。</text></g></svg>